name: COBOL Check

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  cobol-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install GnuCOBOL and Zowe CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol4
          npm install --global @zowe/cli@latest

      - name: Run COBOL Check and mainframe jobs
        env:
          ZOWE_USERNAME: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_OPT_HOST: 204.90.115.200
          ZOWE_OPT_PORT: 10443
          ZOWE_OPT_USER: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_OPT_PASSWORD: ${{ secrets.ZOWE_PASSWORD }}
          ZOWE_OPT_REJECT_UNAUTHORIZED: 'false'
        run: |
          chmod +x .github/scripts/run-cobol-check.sh
          .github/scripts/run-cobol-check.sh EMPPAY
          .github/scripts/run-cobol-check.sh DEPTPAY
